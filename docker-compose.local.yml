version: '3.8'

services:
  backend:
    build:
      context: .
      target: production
    container_name: app_backend_local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=4000
    ports:
      - "4002:4000"
    networks:
      - target_network
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: app_postgres_local
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: vibe_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - target_network

networks:
  target_network:
    driver: bridge

volumes:
  postgres_data:
