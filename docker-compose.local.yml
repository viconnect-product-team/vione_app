name: vione

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: vione-backend-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=4000
    ports:
      - "4002:4000"
    networks:
      - vione-network
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: vione-db-local
    restart: always
    environment:
      POSTGRES_USER: app1
      POSTGRES_PASSWORD: "5^S0CEpvYwC1(#YN1UoJ"
      POSTGRES_DB: vione_app
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vione-network

  minio:
    image: minio/minio:latest
    container_name: vione-minio-local
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9050:9000"
      - "9051:9001"
    volumes:
      - vione-minio-data-local:/data
    command: server /data --console-address ":9001"
    networks:
      - vione-network

networks:
  vione-network:
    driver: bridge

volumes:
  postgres_data:
  vione-minio-data-local:
